[package]
name = "trufi-desktop"
description = "Trufi Cleaner desktop app (Tauri shell around trufi-core)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "trufi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sysinfo.workspace = true
trufi-core.workspace = true
trufi-platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
