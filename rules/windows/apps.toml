# Windows: application caches and logs.

[pack]
id = "windows.apps"
name = "Программы"
os = "windows"
version = 1

[[rule]]
id = "app.discord.cache"
name = "Discord: кеш"
category = "apps"
risk = "safe"
paths = [
  "%APPDATA%/discord/Cache",
  "%APPDATA%/discord/Code Cache",
  "%APPDATA%/discord/GPUCache",
  "%APPDATA%/discord/DawnCache",
  "%APPDATA%/discord/DawnGraphiteCache",
  "%APPDATA%/discord/DawnWebGPUCache",
  "%APPDATA%/discord/Service Worker/CacheStorage",
  "%APPDATA%/discord/Service Worker/ScriptCache",
  "%APPDATA%/discord/Crashpad/reports",
]
close_processes = ["Discord.exe"]

