[[rule]]
id = "app.telegram.media_cache"
name = "Telegram: кеш медиа"
description = "Загруженные фото, видео и стикеры. Telegram скачает их снова при открытии чата."
category = "apps"
risk = "moderate"
paths = ["%APPDATA%/Telegram Desktop/tdata/user_data", "%APPDATA%/Telegram Desktop/tdata/emoji"]
close_processes = ["Telegram.exe"]

[[rule]]
id = "app.spotify.cache"
name = "Spotify: кеш"
description = "Кеш потоковой музыки. Скачанные для офлайна треки не затрагиваются."
category = "apps"
risk = "safe"
paths = ["%LOCALAPPDATA%/Spotify/Data", "%LOCALAPPDATA%/Spotify/Browser/Cache"]
close_processes = ["Spotify.exe"]

[[rule]]
id = "app.zoom.logs"
name = "Zoom: журналы"
category = "logs"
risk = "safe"
paths = ["%APPDATA%/Zoom/logs"]

[[rule]]
id = "app.onedrive.logs"
name = "OneDrive: журналы"
category = "logs"
risk = "safe"
paths = ["%LOCALAPPDATA%/Microsoft/OneDrive/logs", "%LOCALAPPDATA%/Microsoft/OneDrive/setup/logs"]
min_age_hours = 72

[[rule]]
id = "app.adobe.media_cache"
name = "Adobe: медиакеш"
description = "Кеш Premiere Pro и After Effects. Проекты не затрагиваются, превью пересоздадутся."
category = "apps"
risk = "moderate"
paths = ["%APPDATA%/Adobe/Common/Media Cache Files", "%APPDATA%/Adobe/Common/Media Cache", "%APPDATA%/Adobe/Common/Peak Files"]
close_processes = ["Adobe Premiere Pro.exe", "AfterFX.exe"]

[[rule]]
id = "app.java.cache"
name = "Java: кеш загрузок"
category = "apps"
risk = "safe"
paths = ["%USERPROFILE%/AppData/LocalLow/Sun/Java/Deployment/cache"]

[[rule]]
id = "app.office.telemetry"
name = "Microsoft Office: временные файлы"
category = "apps"
risk = "safe"
paths = ["%LOCALAPPDATA%/Microsoft/Office/OTele", "%LOCALAPPDATA%/Microsoft/Office/16.0/Wef/webview2", "%LOCALAPPDATA%/Temp/Outlook Logging"]

[[rule]]
id = "app.vkplay.cache"
name = "VK Play: кеш"
category = "games"
risk = "safe"
paths = ["%LOCALAPPDATA%/GameCenter/Cache", "%LOCALAPPDATA%/GameCenter/Logs"]
close_processes = ["GameCenter.exe"]

[[rule]]
id = "app.roblox.old_versions"
name = "Roblox: старые версии"
description = "Roblox ставит каждое обновление в новую папку и не удаляет прежние. Самая новая версия остаётся."
category = "games"
risk = "safe"
paths = ["%LOCALAPPDATA%/Roblox/Versions"]
keep_newest = 1
close_processes = ["RobloxPlayerBeta.exe", "RobloxStudioBeta.exe"]

[[rule]]
id = "app.roblox.cache"
name = "Roblox: загрузки и журналы"
category = "games"
risk = "safe"
paths = ["%LOCALAPPDATA%/Roblox/Downloads", "%LOCALAPPDATA%/Roblox/logs"]
close_processes = ["RobloxPlayerBeta.exe"]

[[rule]]
id = "app.unity.cache"
name = "Unity: кеш"
category = "developer"
risk = "safe"
paths = ["%LOCALAPPDATA%/Unity/Caches", "%APPDATA%/UnityHub/Cache", "%APPDATA%/UnityHub/Code Cache", "%APPDATA%/UnityHub/GPUCache"]
close_processes = ["Unity.exe", "Unity Hub.exe"]

[[rule]]
id = "app.lightshot.cache"
name = "Lightshot: временные скриншоты"
category = "apps"
risk = "safe"
paths = ["%LOCALAPPDATA%/Skillbrains/lightshot/temp"]
