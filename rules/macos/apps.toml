# macOS: application caches. Electron apps keep them in Application Support
# under the same folder names as on Windows.

[pack]
id = "macos.apps"
name = "Программы"
os = "macos"
version = 2

[[rule]]
id = "mac.app.discord.cache"
name = "Discord: кеш"
category = "apps"
risk = "safe"
paths = [
  "~/Library/Application Support/discord/Cache",
  "~/Library/Application Support/discord/Code Cache",
  "~/Library/Application Support/discord/GPUCache",
  "~/Library/Application Support/discord/DawnCache",
  "~/Library/Application Support/discord/DawnGraphiteCache",
  "~/Library/Application Support/discord/DawnWebGPUCache",
  "~/Library/Application Support/discord/Service Worker/CacheStorage",
  "~/Library/Application Support/discord/Service Worker/ScriptCache",
  "~/Library/Application Support/discord/Crashpad/completed",
]
close_processes = ["Discord", "Discord Helper"]

