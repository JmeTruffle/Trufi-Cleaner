[[rule]]
id = "mac.app.telegram.media_cache"
name = "Telegram Desktop: кеш медиа"
description = "Загруженные фото, видео и стикеры. Telegram скачает их снова при просмотре. Переписка хранится в облаке и не пострадает."
category = "apps"
risk = "moderate"
paths = [
  "~/Library/Application Support/Telegram Desktop/tdata/user_data",
  "~/Library/Application Support/Telegram Desktop/tdata/emoji",
]
close_processes = ["Telegram"]

[[rule]]
id = "mac.app.spotify.cache"
name = "Spotify: кеш"
description = "Кеш потоковой музыки. Скачанные для офлайна треки остаются."
category = "apps"
risk = "safe"
paths = ["~/Library/Caches/com.spotify.client"]
close_processes = ["Spotify", "Spotify Helper"]

[[rule]]
id = "mac.app.adobe.media_cache"
name = "Adobe: медиакеш"
description = "Кеш Premiere Pro, After Effects и Audition. Проекты откроются, но первое воспроизведение будет медленнее."
category = "apps"
risk = "moderate"
paths = [
  "~/Library/Application Support/Adobe/Common/Media Cache Files",
  "~/Library/Application Support/Adobe/Common/Media Cache",
  "~/Library/Application Support/Adobe/Common/Peak Files",
]
close_processes = ["Adobe Premiere Pro", "After Effects", "Adobe Audition"]

