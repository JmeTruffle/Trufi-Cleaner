  "%CONTAINERS%/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/Code Cache",
  "%CONTAINERS%/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/GPUCache",
