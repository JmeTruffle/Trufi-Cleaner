name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trufi-core -p trufi-platform
      - run: cargo clippy -p trufi-core -p trufi-platform -- -D warnings

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Type-check UI
        working-directory: apps/desktop
        run: npm run check
      - name: Rust tests
        run: cargo test -p trufi-core -p trufi-platform
      - name: Clippy (Windows code paths)
        run: cargo clippy --workspace -- -D warnings
      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: trufi-cleaner-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
