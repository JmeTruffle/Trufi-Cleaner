name: CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Also runs the macOS parsers and rule packs against a fake home folder.
      - run: cargo test -p trufi-core -p trufi-platform
      - run: cargo clippy -p trufi-core -p trufi-platform --all-targets -- -D warnings

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Type-check UI
        working-directory: apps/desktop
        run: npm run check
      - name: Rust tests
        run: cargo test -p trufi-core -p trufi-platform
      - name: Clippy (Windows code paths)
        run: cargo clippy --workspace -- -D warnings

  macos:
    name: macOS checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Rust tests
        run: cargo test -p trufi-core -p trufi-platform
      - name: Clippy (macOS code paths)
        run: cargo clippy --workspace -- -D warnings
      # Proves tauri.macos.conf.json, Info.plist and the entitlements bundle,
      # signed the way releases are when the self-signed certificate from
      # scripts/mac-signing-cert.sh is set up (a throwaway one here).
      - name: Throwaway signing certificate
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/mac-signing-cert.sh" > /dev/null
          # Same as the release: the build machine must trust the certificate
          # for code signing, or Tauri does not find the identity.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain trufi-signing/cert.pem
          {
            echo "APPLE_CERTIFICATE=$(cat trufi-signing/cert.p12.base64)"
            echo "APPLE_CERTIFICATE_PASSWORD=$(cat trufi-signing/password.txt)"
            echo "APPLE_SIGNING_IDENTITY=Trufi Cleaner Self-Signed"
          } >> "$GITHUB_ENV"
      - name: Bundle the app (debug, signed)
        working-directory: apps/desktop
        run: npx tauri build --debug --bundles app --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check the signature
        shell: bash
        run: |
          app=$(find target/debug/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign -dvv "$app" 2>&1 | tee /dev/stderr | grep -q "Authority=Trufi Cleaner Self-Signed"
          codesign -d -r- "$app"
